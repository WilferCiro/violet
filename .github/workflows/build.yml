name: Build GTKmm App

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            g++ \
            pkg-config \
            libgtkmm-4.0-dev \
            libglib2.0-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: violet-linux
          path: build/violet

  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtkmm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2

      - name: Configure (Windows)
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          export CMAKE_PREFIX_PATH=/mingw64

          which cmake
          cmake --version
          pkg-config --modversion gtkmm-4.0

          cmake -S . -B build -G "MinGW Makefiles"

      - name: Build (Windows)
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          cmake --build build -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: violet-windows
          path: build/violet.exe

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake gtkmm4 pkg-config

      - name: Configure (macOS)
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake -S . -B build

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: violet-macos
          path: build/violet

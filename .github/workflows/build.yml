name: Build GTKmm App

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            g++ \
            pkg-config \
            libgtkmm-4.0-dev \
            libglib2.0-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: violet-linux
          path: build/violet

  windows:
  name: Windows (MSYS2)
  runs-on: windows-latest

  steps:
    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-gtkmm
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pkgconf

    - name: Configure
      shell: msys2 {0}
      run: cmake -S . -B build -G "MinGW Makefiles"

    - name: Build
      shell: msys2 {0}
      run: cmake --build build -j$(nproc)

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: violet-windows
        path: build/violet.exe


  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake gtkmm4 pkg-config

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: violet-macos
          path: build/violet
